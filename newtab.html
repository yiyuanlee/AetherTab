<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-scheme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AetherTab is a premium, glassmorphic Chrome extension that overrides the New Tab page to help you save, organize, and manage browser tabs in beautiful, custom collections.">
  <title>AetherTab | Premium Tab Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newtab.css?v=onboarding">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar: Active Tabs -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="icons/icon48.png" width="24" height="24" class="logo-icon" alt="AetherTab">
          <span class="logo-text">AetherTab</span>
        </div>
        <button class="toggle-sidebar-btn" id="toggle-sidebar" title="Collapse Sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>

      <div class="sidebar-search">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" class="search-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="active-search" placeholder="Search open tabs...">
        </div>
      </div>

      <div class="active-tabs-section">
        <div class="section-title-bar">
          <span class="section-title">Open Tabs (<span id="active-tab-count">0</span>)</span>
          <button id="save-session-btn" class="action-link-btn" title="Save all open tabs to a new collection">Save Session</button>
        </div>
        <div class="active-tabs-list" id="active-tabs-list">
          <!-- Active tabs will be injected here dynamically -->
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="sync-toggle-btn sync-off" id="sync-toggle" title="Toggle cross-device sync via Chrome Sync">
          <svg viewBox="0 0 24 24" width="20" height="20" class="sync-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
          <span class="sync-label">Sync Off</span>
          <span class="sync-status-dot" aria-hidden="true"></span>
        </button>
        <div class="color-scheme-picker" id="color-scheme-picker">
          <span class="color-scheme-label">Accent</span>
          <div class="color-scheme-options" role="radiogroup" aria-label="Color theme">
            <button type="button" class="color-scheme-btn active" data-scheme="default" title="Default — Aether Purple" aria-label="Default theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="flag-default" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs><rect width="30" height="20" rx="3" fill="url(#flag-default)"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="argentina" title="Argentina — Sky Blue & White" aria-label="Argentina theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="6.67" fill="#75aadb"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#75aadb"/><circle cx="15" cy="10" r="2.5" fill="#f6b40e"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="portugal" title="Portugal — Green & Red" aria-label="Portugal theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="12" height="20" fill="#006600"/><rect x="12" width="18" height="20" fill="#ff0000"/><circle cx="12" cy="10" r="4" fill="#ffcc00" stroke="#fff" stroke-width="0.6"/><rect x="10.5" y="8" width="3" height="4" fill="#fff" opacity="0.85"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="france" title="France — Navy Blue & Red" aria-label="France theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="20" fill="#002654"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ed2939"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="brazil" title="Brazil — Green & Yellow" aria-label="Brazil theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#009c3b"/><polygon points="15,2 28,10 15,18 2,10" fill="#ffdf00"/><circle cx="15" cy="10" r="4" fill="#002776"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="germany" title="Germany — Black, Red & Gold" aria-label="Germany theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#dd0000"/><rect y="13.33" width="30" height="6.67" fill="#ffce00"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="england" title="England — Red & White" aria-label="England theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#fff"/><rect x="12.5" width="5" height="20" fill="#ce1124"/><rect y="7.5" width="30" height="5" fill="#ce1124"/></svg></span>
            </button>
            <button type="button" class="color-scheme-btn" data-scheme="spain" title="Spain — Red & Yellow" aria-label="Spain theme">
              <span class="scheme-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="5" fill="#c60b1e"/><rect y="5" width="30" height="10" fill="#ffc400"/><rect y="15" width="30" height="5" fill="#c60b1e"/></svg></span>
            </button>
          </div>
        </div>
        <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Theme">
          <svg viewBox="0 0 24 24" width="20" height="20" class="sun-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg viewBox="0 0 24 24" width="20" height="20" class="moon-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span class="theme-label">Dark Mode</span>
        </button>
      </div>
    </aside>

    <button class="expand-sidebar-btn hidden" id="expand-sidebar" title="Expand Sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>

    <!-- Main Workspace -->
    <main class="main-content">
      <header class="workspace-header">
        <div class="datetime-greeting">
          <h1 id="greeting">Hello</h1>
          <div class="datetime-info">
            <span id="digital-clock">00:00:00</span>
            <span class="dot-separator">•</span>
            <span id="date-string">Monday, January 1</span>
          </div>
        </div>
        
        <!-- Weather Widget Card in the middle -->
        <div class="weather-widget" id="weather-widget">
          <!-- Setup View (default/no location) -->
          <div class="weather-setup" id="weather-setup">
            <div class="weather-setup-title">Today's Weather</div>
            <div class="weather-setup-btns">
              <button class="weather-btn" id="weather-gps-btn" title="Use current GPS location">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line></svg>
                GPS
              </button>
              <button class="weather-btn" id="weather-city-btn" title="Search city manually">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Search
              </button>
            </div>
          </div>

          <!-- Loading View -->
          <div class="weather-loading hidden" id="weather-loading">
            <div class="weather-shimmer-circle"></div>
            <div class="weather-shimmer-lines">
              <div class="weather-shimmer-line short"></div>
              <div class="weather-shimmer-line"></div>
            </div>
          </div>

          <!-- Display View -->
          <div class="weather-display hidden" id="weather-display">
            <div class="weather-icon-container" id="weather-icon">
              <!-- SVG icon will be injected here -->
            </div>
            <div class="weather-details">
              <div class="weather-temp-row">
                <span class="weather-temp" id="weather-temp" title="Click to toggle Celsius / Fahrenheit">--°C</span>
                <span class="weather-desc" id="weather-desc">Loading...</span>
              </div>
              <div class="weather-loc-row">
                <span class="weather-location" id="weather-location" title="Click to change location">Detecting...</span>
                <span class="weather-range" id="weather-range">-- / --</span>
              </div>
            </div>
          </div>

          <!-- Inline Search Input -->
          <div class="weather-search-input-container hidden" id="weather-search-container">
            <input type="text" id="weather-search-input" placeholder="Enter city name..." title="Press Enter to search">
            <button class="weather-search-close-btn" id="weather-search-close">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        
        <div class="workspace-search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" class="search-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="workspace-search" placeholder="Search saved collections and tabs... (/)" title="Press / to focus">
        </div>
      </header>

      <section class="collections-container">
        <div class="collections-header">
          <h2>My Collections</h2>
          <button id="new-collection-btn" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Create Collection
          </button>
        </div>

        <div class="collections-grid" id="collections-grid">
          <!-- Collections cards will be injected here dynamically -->
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toast-container"></div>

  <section class="onboarding hidden" id="onboarding" aria-label="Welcome to AetherTab">
    <div class="onboarding-card" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
      <div class="onboarding-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="onboarding-eyebrow" data-onboarding-eyebrow></p>
      <h2 id="onboarding-title" data-onboarding-title></h2>
      <p class="onboarding-body" data-onboarding-body></p>
      <div class="onboarding-footer">
        <button class="onboarding-skip" type="button" data-onboarding-skip>Skip for now</button>
        <div class="onboarding-actions"><span data-onboarding-progress></span><button class="btn btn-primary" type="button" data-onboarding-next>Continue</button></div>
      </div>
    </div>
  </section>

  <!-- Dialog for Custom Tab Addition -->
  <div class="modal-overlay hidden" id="custom-tab-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Custom Link</h3>
        <button class="close-modal-btn" id="close-modal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="custom-title">Link Title</label>
          <input type="text" id="custom-title" placeholder="e.g., Google Search">
        </div>
        <div class="form-group">
          <label for="custom-url">URL</label>
          <input type="url" id="custom-url" placeholder="https://google.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-modal">Cancel</button>
        <button class="btn btn-primary" id="save-modal">Add to Collection</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
